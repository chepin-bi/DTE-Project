name: DTE-Core CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install numpy scipy pytest pytest-cov

      - name: Run tests
        run: |
          PYTHONPATH=python pytest tests/ -v --cov=python/dte --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  test-lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean 4
        uses: leanprover/lean-action@v1
        with:
          auto-config: true

      - name: Build Lean project
        run: |
          cd lean
          lake update
          lake build

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lint tools
        run: |
          pip install flake8 black isort mypy

      - name: Lint with flake8
        run: |
          flake8 python/dte/ --max-line-length=100 --extend-ignore=E203,W503

      - name: Check formatting with black
        run: |
          black --check python/

      - name: Check imports with isort
        run: |
          isort --check --profile=black python/

      - name: Type check with mypy
        run: |
          mypy python/dte/ --ignore-missing-imports --follow-imports=silent
