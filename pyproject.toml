[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dte-core"
version = "2.0.0"
description = "Derived Triangle Equivalence (DTE) unified framework for quantum entanglement analysis"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "SAG-ISU-UHODP-DTE Research Group", email = "chepin@163.com"}
]
keywords = [
    "quantum-entanglement",
    "information-theory",
    "category-theory",
    "holography",
    "quantum-computing",
    "lean4"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Other :: Lean",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "flake8>=4.0",
    "black>=22.0",
    "mypy>=1.0",
]
neuro = [
    "mne>=1.4",
    "nibabel>=4.0",
    "scikit-learn>=1.2",
]
finance = [
    "pandas>=1.5",
    "yfinance>=0.2",
]
all = [
    "dte-core[dev,neuro,finance]"
]

[project.urls]
Homepage = "https://github.com/chepin-ai/DTE-Project"
Documentation = "https://github.com/chepin-ai/DTE-Project#readme"
Repository = "https://github.com/chepin-ai/DTE-Project.git"
Issues = "https://github.com/chepin-ai/DTE-Project/issues"

[tool.setuptools.packages.find]
where = ["python"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
addopts = "-v --tb=short"
